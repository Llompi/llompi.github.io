<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Joan Llompart</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0d0d0f">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem("theme"); } catch (e) {}
      var theme = stored || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute("content", theme === "light" ? "#f1f1ef" : "#0d0d0f");
    })();
  </script>
  <link rel="preload" href="/assets/fonts/archivo-400-800-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/ibm-plex-mono-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .lost {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }
    .lost-code {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      letter-spacing: 0.14em;
      color: var(--copper);
      margin-bottom: 1rem;
    }
    .lost h1 {
      font-size: var(--text-xl);
      margin-bottom: 1rem;
    }
    .lost p {
      color: var(--text-2);
      margin-bottom: 2rem;
      max-width: 34rem;
    }
  </style>
</head>
<body>
  <main class="lost">
    <div class="container">
      <p class="lost-code">Error 404</p>
      <h1>This trace doesn't connect to anything.</h1>
      <p>That page doesn't exist, or it moved. The projects and contact details are on the home page.</p>
      <a class="btn btn-primary" href="/">Back to the portfolio</a>
    </div>
  </main>
</body>
</html>
