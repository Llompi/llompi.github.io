name: Disclosure check

# Blocks a push or pull request that would publish a denylisted term or a
# photo carrying location or serial-number metadata. See PUBLISHING.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan the published tree
        env:
          DISCLOSURE_TERMS: ${{ secrets.DISCLOSURE_TERMS }}
        run: node tools/disclosure-check.mjs
