name: Disclosure check

# Flags a push or pull request that publishes a denylisted term or a photo
# carrying location or serial-number metadata. The git hooks in .githooks/
# stop these before a push; this is the alarm if one gets through.
# See PUBLISHING.md.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan the published tree
        env:
          DISCLOSURE_TERMS: ${{ secrets.DISCLOSURE_TERMS }}
        run: node tools/disclosure-check.mjs

      # The tree can be clean while a pushed commit in between was not
      - name: Scan the pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          DISCLOSURE_TERMS: ${{ secrets.DISCLOSURE_TERMS }}
        run: node tools/disclosure-check.mjs --range "${{ github.event.before }}..${{ github.sha }}"
